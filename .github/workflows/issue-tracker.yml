name: Issue Tracker

permissions: {}

on:
  issues:
    types: [opened, reopened, closed]

jobs:
  track-issue:
    name: Track Issue Updates
    runs-on: ubuntu-latest

    steps:
      - name: Send Issue Data to API
        env:
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_ID: ${{ github.event.issue.id }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          RAW_TITLE: ${{ github.event.issue.title }}
          RAW_BODY: ${{ github.event.issue.body }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          CREATED_AT: ${{ github.event.issue.created_at }}
          UPDATED_AT: ${{ github.event.issue.updated_at }}
          CLOSED_AT: ${{ github.event.issue.closed_at }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          USER_LOGIN: ${{ github.event.issue.user.login }}
          REPO_NAME: ${{ github.repository }}
          RAW_LABELS: ${{ toJSON(github.event.issue.labels) }}
          RAW_ASSIGNEES: ${{ toJSON(github.event.issue.assignees) }}
          API_URL: ${{ secrets.ISSUE_TRACKER_API_URL }}
          VERIFY_TOKEN: ${{ secrets.VERIFY_TOKEN }}
        run: |
          ISSUE_DATA=$(jq -n \
            --arg action "$EVENT_ACTION" \
            --arg id "$ISSUE_ID" \
            --arg num "$ISSUE_NUM" \
            --arg title "$RAW_TITLE" \
            --arg body "$RAW_BODY" \
            --arg state "$ISSUE_STATE" \
            --arg created_at "$CREATED_AT" \
            --arg updated_at "$UPDATED_AT" \
            --arg closed_at "$CLOSED_AT" \
            --arg url "$ISSUE_URL" \
            --arg user_login "$USER_LOGIN" \
            --arg repository "$REPO_NAME" \
            --argjson labels "$RAW_LABELS" \
            --argjson assignees "$RAW_ASSIGNEES" \
            '{
              action: $action,
              issue: {
                id: ($id | tonumber),
                number: ($num | tonumber),
                title: $title,
                body: $body,
                state: $state,
                created_at: $created_at,
                updated_at: $updated_at,
                closed_at: $closed_at,
                url: $url,
                user: { login: $user_login },
                labels: $labels,
                assignees: $assignees
              },
              repository: { name: $repository },
            }')

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "Token: $VERIFY_TOKEN" \
            -d "$ISSUE_DATA")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Successfully sent issue data to API"
          else
            echo "Failed to send issue data to API"
            exit 1
          fi
